tooltip.unit.HQ-Air.append=				<i> * Highly co-ordinated Air Command HQ</i>               <br> <b><p style="color:red;"> * Support: +1 Atk/Def to 5 Dog Fight units</p></b>	<b><p style="color:red;">* Support: +1 Atk/Def to 5 Air to Ground units</p></b> * Most nations can have 1 <br> <b><p style="color:#FF7518;">* Cannot target Inf-Elite, Inf-Trained, Inf-Conscript</p></b>
