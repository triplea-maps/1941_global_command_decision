tooltip.unit.HQ-Fleet.append=			<i> * Highly co-ordinated Fleet & Air Command HQ</i>       <br> <b><p style="color:red;"> * Support: +1 Atk/Def to 5 Dog Fight units</p></b>	<b><p style="color:red;">* Support: +1 Atk/Def to 5 Sea units          </p></b>	* Shore Bombard 2	<br> * Britain, Italy, Japan, Pacific-Allies, USA can have 3	
