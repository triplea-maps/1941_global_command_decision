tooltip.unit.Industry-Lgt.append=		* Light Industrial Complex can produce 2 units per turn  <br> * Produces 5pu/turn <br> * has own Anti-Air defense <br> <b><p style="color:green;"> * Rail links to move land units upto 3 territories, depending on terrain effects</p></b>	* When captured suffers 2 Raid Damage <br> * Can produce Inf-Conscript, Inf-Trained, Inf-Motorized, Armor-Lgt, Artillery, Bunker

tooltip.unit.Base-Camp.append=			* Forward Base, Camp, Barracks, can produce 1 Infantry unit per turn			<br>  * has own Anti-Air defense <br> * Can produce Inf-Conscript, Inf-Trained, Inf-Elite, Inf-Motorized
tooltip.unit.Bunker.append=				<i> * Garrisoned infantry in prepared defenses, like Trenches and Bunkers</i>	<br> <b><p style="color:#FF7518;">* Cannot target Air units, as it has no AA</p></b>					* 2HP with only -1pu Upkeep
tooltip.unit.Factory.append=			<i> * Factories support the long term war effort</i>							<br> * Produces 3pu/turn each <br> * has own Anti-Air defense																																				   <br> * When captured suffers 1 Raid Damage

